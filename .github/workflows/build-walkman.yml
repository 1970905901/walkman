name: Build walkman (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'walkman_v*'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build iOS app (unsigned)
        run: |
          set -euo pipefail
          DERIVED="$PWD/build/ios-derived"
          xcodebuild -project walkman.xcodeproj \
            -scheme walkman \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -20
          APP=$(find "$DERIVED/Build/Products/Release-iphoneos" -name "walkman.app" -maxdepth 1 | head -1)
          echo "APP=$APP"
          [ -d "$APP" ] || { echo "iOS .app not found"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -q -r walkman-unsigned.ipa Payload
          ls -lh walkman-unsigned.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: walkman-ios-ipa
          path: walkman-unsigned.ipa

  build-macos:
    name: Build macOS DMG (unsigned, Catalyst)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Mac Catalyst app (unsigned)
        run: |
          set -euo pipefail
          DERIVED="$PWD/build/mac-derived"
          xcodebuild -project walkman.xcodeproj \
            -scheme walkman \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -20
          APP=$(find "$DERIVED/Build/Products/Release-maccatalyst" -name "walkman.app" -maxdepth 1 | head -1)
          echo "APP=$APP"
          [ -d "$APP" ] || { echo "macOS .app not found"; exit 1; }
          echo "$APP" > app_path.txt

      - name: Package DMG (hdiutil)
        run: |
          set -euo pipefail
          APP=$(cat app_path.txt)
          STAGE="$PWD/build/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "walkman" -srcfolder "$STAGE" -ov -format UDZO build/walkman-unsigned.dmg
          ls -lh build/walkman-unsigned.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: walkman-macos-dmg
          path: build/walkman-unsigned.dmg

  release:
    name: Publish release (on tag)
    needs: [build-ios, build-macos]
    if: startsWith(github.ref, 'refs/tags/walkman_v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/walkman-unsigned.ipa
            out/walkman-unsigned.dmg
